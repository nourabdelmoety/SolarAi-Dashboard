name: Fetch Energy Prices

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch price data from energy-charts.info
        run: |
          mkdir -p data
          curl -s --max-time 30 \
            "https://api.energy-charts.info/price?bzn=DE-LU" \
            -H "Accept: application/json" \
            -o data/prices.json
          
          # Verify the file is valid JSON and has content
          if python3 -c "import json,sys; d=json.load(open('data/prices.json')); assert 'price' in d and len(d['price']) > 0" 2>/dev/null; then
            echo "✅ Price data fetched successfully ($(python3 -c "import json; d=json.load(open('data/prices.json')); print(len(d['price']))" ) data points)"
          else
            echo "❌ Invalid or empty data received, keeping previous file"
            git checkout -- data/prices.json 2>/dev/null || echo "No previous file to restore"
            exit 1
          fi

      - name: Commit and push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "No changes to commit (data is the same)"
          else
            git commit -m "chore: auto-update energy prices [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
